# Example: reach the UI (127.0.0.1:9000) from the LAN over plain HTTP.
# Copy into conf.d and reload, then publish :9001 in the compose.

# This listener is an edge: overwrite client-supplied forwarding headers.
# For a separate TLS terminator, configure a dedicated trusted/internal listener.

server {
    listen 9001;

    # local networks only
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;              # live log stream (SSE)
        proxy_read_timeout 1h;
    }
}
