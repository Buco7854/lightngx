<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Lightngx — a lightweight web UI for managing nginx">
  <defs>
    <style>@font-face{font-family:'InterLN';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterLN';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterLN';font-style:normal;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}</style>
    <linearGradient id="mark" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#2fbf60"/><stop offset="1" stop-color="#00873a"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#0c1c14"/><stop offset=".52" stop-color="#0a1710"/><stop offset="1" stop-color="#070f0b"/>
    </linearGradient>
    <radialGradient id="glowA" gradientUnits="userSpaceOnUse" cx="192" cy="290" r="408" gradientTransform="translate(0 44.4) scale(1 0.847)">
      <stop offset="0" stop-color="#26b356" stop-opacity=".24"/><stop offset="1" stop-color="#26b356" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" gradientUnits="userSpaceOnUse" cx="1104" cy="38" r="360">
      <stop offset="0" stop-color="#1a7840" stop-opacity=".2"/><stop offset="1" stop-color="#1a7840" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" gradientUnits="userSpaceOnUse" cx="120" cy="315" r="744">
      <stop offset=".1" stop-color="#fff"/><stop offset=".72" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#gridFade)"/></mask>
    <linearGradient id="snipGrad" gradientUnits="userSpaceOnUse" x1="1085" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset=".42" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="snipfade"><rect width="1200" height="630" fill="url(#snipGrad)"/></mask>
    <filter id="markGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="14" stdDeviation="21" flood-color="#009639" flood-opacity=".42"/>
    </filter>
  </defs>

  <g>
    <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
    <g mask="url(#gridMask)"><rect width="1200" height="630" rx="0" fill="url(#grid)"/></g>
    <rect width="1200" height="630" rx="0" fill="url(#glowA)"/>
    <rect width="1200" height="630" rx="0" fill="url(#glowB)"/>
  </g>
  
  <g transform="translate(174 231) scale(1.6800)" filter="url(#markGlow)"><polygon points="50 14 81.2 32 81.2 68 50 86 18.8 68 18.8 32" fill="url(#mark)" stroke="url(#mark)" stroke-width="12" stroke-linejoin="round"/><path d="M38 35v30h24" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g font-family="InterLN,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="399" y="284.2" font-size="84" font-weight="800" fill="#fff" textLength="367.4" lengthAdjust="spacingAndGlyphs">Lightngx</text>
    <text x="399" y="325.3" font-size="29" font-weight="400" fill="#a9cdb8" textLength="562.9" lengthAdjust="spacingAndGlyphs">A lightweight web UI for managing nginx.</text>
    <g><rect x="399" y="360" width="177.3" height="47" rx="23.5" fill="#26b356" fill-opacity=".10" stroke="#78dca0" stroke-opacity=".22"/><text x="487.7" y="390.0" text-anchor="middle" textLength="137.3" lengthAdjust="spacingAndGlyphs" font-size="19" font-weight="600" fill="#bfe4cd">Guarded editor</text></g><g><rect x="588.33251953125" y="360" width="121.4" height="47" rx="23.5" fill="#26b356" fill-opacity=".10" stroke="#78dca0" stroke-opacity=".22"/><text x="649.0" y="390.0" text-anchor="middle" textLength="81.4" lengthAdjust="spacingAndGlyphs" font-size="19" font-weight="600" fill="#bfe4cd">Live logs</text></g><g><rect x="721.73193359375" y="360" width="131.7" height="47" rx="23.5" fill="#26b356" fill-opacity=".10" stroke="#78dca0" stroke-opacity=".22"/><text x="787.6" y="390.0" text-anchor="middle" textLength="91.7" lengthAdjust="spacingAndGlyphs" font-size="19" font-weight="600" fill="#bfe4cd">OIDC SSO</text></g><g><rect x="865.419921875" y="360" width="160.2" height="47" rx="23.5" fill="#26b356" fill-opacity=".10" stroke="#78dca0" stroke-opacity=".22"/><text x="945.5" y="390.0" text-anchor="middle" textLength="120.2" lengthAdjust="spacingAndGlyphs" font-size="19" font-weight="600" fill="#bfe4cd">Single binary</text></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="629" rx="0" fill="none" stroke="#fff" stroke-opacity=".07"/>
</svg>
